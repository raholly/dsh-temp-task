name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (stage publish needs >= 11.15)
        run: npm install --global npm@11.21.2

      - name: Test
        run: npm test

      - name: Stage publish (maintainer approves on npmjs.com)
        run: npm stage publish --access public
